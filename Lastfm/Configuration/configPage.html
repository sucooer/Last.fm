<!DOCTYPE html>
<html>
<head>
    <title>Last.fm Scrobbler Configuration</title>
</head>
<body>
    <div id="LastfmScrobblerConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">

        <style>
            /* Emby 4.9+ renders plugin configuration pages as an overlay; the old
               data-role="page" classes no longer provide a background, so the page
               content bleeds through whatever is underneath. Give it a solid
               background and padding. The style tag lives inside the page div
               because Emby strips <head> when injecting plugin pages. */
            #LastfmScrobblerConfigurationPage {
                background: #ffffff;
                min-height: 100%;
                padding: 1.5em 2em;
                box-sizing: border-box;
            }
            #LastfmScrobblerConfigurationPage .sectionTitle {
                font-size: 1.2em;
                font-weight: 600;
                margin-bottom: 0.6em;
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <div class="sectionTitle">Last.fm 授权（API Key + Token 流程）</div>
                <div class="paperList" style="margin-bottom: 1em;">
                    <div class="listItem">
                        <div class="listItemBody">
                            <div>
                                1. 用你的 Last.fm 账号在 <a href="https://www.last.fm/api/account/create" target="_blank">https://www.last.fm/api/account/create</a> 免费注册一个 API 应用，拿到 <b>API Key</b> 和 <b>Shared Secret</b>（Callback URL 可留空）。
                            </div>
                            <div>
                                2. 把 Key / Secret 填到下方并点“保存 API 配置”。
                            </div>
                            <div>
                                3. 点“① 获取授权链接”，在打开的 Last.fm 页面登录并点击允许（Authorize）。
                            </div>
                            <div>
                                4. 回到本页点“② 完成授权”，看到“已授权用户”即成功，之后播放音乐即自动 scrobble。
                            </div>
                        </div>
                    </div>
                </div>

                <form id="LastfmScrobblerConfigurationForm">
                    <div class="inputContainer">
                        <input is="emby-input" id="apiKey" name="apiKey" type="text" label="API Key:" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="apiSecret" name="apiSecret" type="password" label="Shared Secret:" />
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block"><span>保存 API 配置</span></button>
                    </div>
                    <div style="margin-top:1em;">
                        <button is="emby-button" type="button" id="btnAuthUrl" class="raised button-submit block"><span>① 获取授权链接</span></button>
                    </div>
                    <div style="margin-top:0.5em;">
                        <button is="emby-button" type="button" id="btnCompleteAuth" class="raised button-submit block"><span>② 完成授权</span></button>
                    </div>
                    <div id="authStatus" class="fieldDescription" style="margin-top:1em;"></div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            var LastfmScrobblerConfigurationPage = {
                _pluginUniqueId: "de7fe7f0-b048-439e-a431-b1a7e99c930d",
                _config: null,

                init: function ($ctx) {
                    this.$el = $ctx;

                    this.$el.find('#LastfmScrobblerConfigurationForm').on('submit', this, this.onSubmit);
                    this.$el.find('#btnAuthUrl').on('click', this, this.onGetAuthUrl);
                    this.$el.find('#btnCompleteAuth').on('click', this, this.onCompleteAuth);

                    this.loadConfiguration().then($.proxy(function () {
                        this.populateInputs();
                    }, this));
                },

                loadConfiguration: function () {
                    return ApiClient.getPluginConfiguration(this._pluginUniqueId).then($.proxy(function (config) {
                        this._config = config;
                    }, this));
                },

                populateInputs: function () {
                    var config = this._config || {};

                    this.$el.find('#apiKey').val(config.ApiKey || '');
                    this.$el.find('#apiSecret').val(config.ApiSecret || '');

                    this.updateAuthStatus();
                },

                updateAuthStatus: function () {
                    var config = this._config || {};
                    var html = '';

                    if (config.SessionKey) {
                        html = '<b>已授权用户：</b>' + (config.LastfmUsername || '?') + '（session key 已保存，scrobble 已启用）';
                    } else {
                        html = '尚未授权。请先保存 API 配置，然后点击“① 获取授权链接”。';
                    }

                    this.$el.find('#authStatus').html(html);
                },

                saveConfiguration: function () {
                    return ApiClient.updatePluginConfiguration(this._pluginUniqueId, this._config).then($.proxy(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    }, this));
                },

                onSubmit: function (e) {
                    e.preventDefault();
                    var self = e.data;

                    self._config.ApiKey = self.$el.find('#apiKey').val().trim();
                    self._config.ApiSecret = self.$el.find('#apiSecret').val().trim();

                    self.saveConfiguration().then(function () {
                        Dashboard.showMessage('API 配置已保存');
                    });
                },

                onGetAuthUrl: function (e) {
                    e.preventDefault();
                    var self = e.data;

                    var apiKey = self.$el.find('#apiKey').val().trim();
                    if (!apiKey) {
                        Dashboard.showError('请先填写 API Key');
                        return;
                    }

                    // Persist the key first so the backend can build the auth URL.
                    self._config.ApiKey = apiKey;
                    self._config.ApiSecret = self.$el.find('#apiSecret').val().trim();

                    self.saveConfiguration().then(function () {
                        ApiClient.ajax({
                            type: 'POST',
                            url: ApiClient.getUrl('Lastfm/GetAuthUrl'),
                            data: JSON.stringify({ ApiKey: apiKey }),
                            contentType: 'application/json',
                            dataType: 'json'
                        }).then(function (data) {
                            if (data && data.Url) {
                                window.open(data.Url, '_blank');
                                Dashboard.showMessage('已在新窗口打开授权页。请登录 Last.fm 并点击允许，然后回到本页点“② 完成授权”。');
                            } else {
                                Dashboard.showError((data && data.Error) || '获取授权链接失败');
                            }
                        });
                    });
                },

                onCompleteAuth: function (e) {
                    e.preventDefault();
                    var self = e.data;

                    ApiClient.ajax({
                        type: 'POST',
                        url: ApiClient.getUrl('Lastfm/CompleteAuth'),
                        data: JSON.stringify({}),
                        contentType: 'application/json',
                        dataType: 'json'
                    }).then(function (data) {
                        if (data && data.Name) {
                            self._config.SessionKey = data.SessionKey;
                            self._config.LastfmUsername = data.Name;

                            self.saveConfiguration().then(function () {
                                self.updateAuthStatus();
                                Dashboard.showMessage('授权成功：' + data.Name);
                            });
                        } else {
                            Dashboard.showError((data && data.Error) || '完成授权失败');
                        }
                    });
                }
            };

            $('#LastfmScrobblerConfigurationPage').on('pageshow', function () {
                LastfmScrobblerConfigurationPage.init($(this));
            });
        </script>
    </div>
</body>
</html>
